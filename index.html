<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>치와치와</title>
    <!-- Game sharing preview: room invitations keep their destination in the URL. -->
    <meta name="description" content="귀여운 캐릭터와 즐기는 낙하 퍼즐 대전 게임입니다." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="치와치와" />
    <meta property="og:title" content="치와치와" />
    <meta property="og:description" content="귀여운 캐릭터와 즐기는 낙하 퍼즐 대전 게임입니다." />
    <meta property="og:image" content="https://seongyonglee.github.io/chii-drop/skins/chiikawa/pages-runtime/assets/e8355f50712d16277df1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1774" />
    <meta property="og:image:height" content="887" />
    <meta property="og:image:alt" content="치와치와 타이틀 그림" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="치와치와" />
    <meta name="twitter:description" content="귀여운 캐릭터와 즐기는 낙하 퍼즐 대전 게임입니다." />
    <meta name="twitter:image" content="https://seongyonglee.github.io/chii-drop/skins/chiikawa/pages-runtime/assets/e8355f50712d16277df1.png" />
    <meta name="twitter:image:alt" content="치와치와 타이틀 그림" />
    <link rel="icon" type="image/svg+xml" href="skins/chiikawa/pages-runtime/favicon.svg?v=2" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="loading-screen" class="loading-screen" aria-labelledby="loading-title">
      <div class="loading-card">
        <h1 id="loading-title">게임을 준비하고 있어요</h1>
        <p data-loading-stage role="status">게임 자료 확인 중…</p>
        <progress data-loading-bar max="100" aria-label="게임 로딩 진행률"></progress>
        <strong data-loading-percent>잠시만 기다려 주세요</strong>
        <p data-loading-detail>이미지와 소리를 준비합니다.</p>
        <button type="button" data-loading-retry hidden>다시 시도</button>
      </div>
    </section>
    <aside id="background-download" class="background-download" aria-label="경기 자료 준비 상태" hidden>
      <span data-download-label>경기 자료 준비 중</span>
      <strong data-download-percent>0%</strong>
      <progress data-download-bar max="100" value="0" aria-label="경기 자료 준비 진행률"></progress>
      <button data-download-retry type="button" hidden>재시도</button>
      <span data-download-announcement class="download-announcement" role="status" aria-live="polite"></span>
    </aside>
    <main class="stage">
      <canvas id="screen" aria-label="게임 화면"></canvas>
      <button id="screen-back" class="screen-back" type="button" hidden>뒤로</button>
      <button id="game-menu-toggle" class="game-menu-toggle" type="button" aria-label="대전 메뉴" aria-haspopup="dialog" hidden>☰</button>
    </main>
    <section id="mobile-controls" class="mobile-controls" aria-label="게임 메뉴와 조작" hidden>
      <h1 data-menu-heading hidden></h1>
      <p data-mobile-label role="status" aria-live="polite">불러오는 중…</p>
      <button data-mobile-player type="button" class="mobile-player" hidden>1P 조작 · 전환</button>
      <div data-mobile-items class="mobile-items" aria-label="화면 항목" hidden></div>
      <div data-mobile-notice class="mobile-notice" hidden></div>
      <div data-mobile-menu class="mobile-pad">
        <div class="mobile-direction">
          <button type="button" data-input="32" class="mobile-up" aria-label="위로 선택">↑</button>
          <button type="button" data-input="1" class="mobile-left" aria-label="왼쪽 선택">←</button>
          <button type="button" data-input="4" class="mobile-down" aria-label="아래로 선택">↓</button>
          <button type="button" data-input="2" class="mobile-right" aria-label="오른쪽 선택">→</button>
        </div>
        <div class="mobile-actions">
          <button type="button" data-input="64" data-mobile-confirm class="mobile-confirm">결정</button>
          <button type="button" data-input="128">뒤로</button>
        </div>
      </div>
      <div data-mobile-game class="mobile-pad" hidden>
        <div class="mobile-move">
          <button type="button" data-input="1" aria-label="왼쪽 이동"><span aria-hidden="true"><svg viewBox="0 0 34 34" focusable="false"><path d="M25 17H9m7-7-7 7 7 7"/></svg></span><small aria-hidden="true">왼쪽</small></button>
          <button type="button" data-input="4" aria-label="빠르게 내리기"><span aria-hidden="true"><svg viewBox="0 0 34 34" focusable="false"><path d="M17 9v16m-7-7 7 7 7-7"/></svg></span><small aria-hidden="true">내리기</small></button>
          <button type="button" data-input="2" aria-label="오른쪽 이동"><span aria-hidden="true"><svg viewBox="0 0 34 34" focusable="false"><path d="M9 17h16m-7-7 7 7-7 7"/></svg></span><small aria-hidden="true">오른쪽</small></button>
        </div>
        <div class="mobile-turn">
          <button type="button" data-input="16" aria-label="왼쪽 회전"><span aria-hidden="true"><svg viewBox="0 0 34 34" focusable="false"><path d="M10 11a10 10 0 1 1-2 11M10 5v7H3"/></svg></span><small aria-hidden="true">왼 회전</small></button>
          <button type="button" data-input="8" aria-label="오른쪽 회전"><span aria-hidden="true"><svg viewBox="0 0 34 34" focusable="false"><g transform="translate(34 0) scale(-1 1)"><path d="M10 11a10 10 0 1 1-2 11M10 5v7H3"/></g></svg></span><small aria-hidden="true">오른 회전</small></button>
          <button type="button" data-input="256" class="mobile-pause" aria-label="대전 메뉴" aria-haspopup="dialog"><span aria-hidden="true"><svg viewBox="0 0 34 34" focusable="false"><path d="M9 10h16M9 17h16M9 24h16"/></svg></span><small aria-hidden="true">메뉴</small></button>
        </div>
      </div>
    </section>
    <footer id="fan-notice" class="fan-notice" hidden aria-label="제작·권리 안내"></footer>
    <script>
      // HTML만 새 버전이고 하위 모듈·CSS가 이전 캐시에 남는 배포 전환을 막는다.
      (async () => {
        try {
          const response = await fetch('version.json', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Version HTTP ${response.status}`);
          const info = await response.json();
          if (!Array.isArray(info.modules) || !info.modules.includes('src/app/main.js')) throw new Error('Module list missing');
          const version = info.commit || info.version;
          const imports = {};
          for (const path of info.modules) {
            if (!/^src\/[\w/-]+\.js$/.test(path)) throw new Error('Invalid module path');
            const url = new URL(path, document.baseURI);
            imports[url.href] = `${url.href}?v=${encodeURIComponent(version)}`;
          }
          const map = document.createElement('script');
          map.type = 'importmap'; map.textContent = JSON.stringify({ imports });
          document.head.append(map);
          document.querySelector('link[rel="stylesheet"]').href = `style.css?v=${encodeURIComponent(version)}`;
          await import(imports[new URL('src/app/main.js', document.baseURI).href]);
        } catch (error) {
          console.error('Game startup failed', error);
          document.querySelector('[data-loading-stage]').textContent = '게임을 시작하지 못했습니다';
          document.querySelector('[data-loading-percent]').textContent = '새로고침해 주세요';
          document.querySelector('[data-loading-detail]').textContent = '연결 상태를 확인한 뒤 다시 시도해 주세요.';
          const retry = document.querySelector('[data-loading-retry]');
          retry.hidden = false;
          retry.onclick = () => location.reload();
        }
      })();
    </script>
  </body>
</html>
