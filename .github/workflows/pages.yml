name: Deploy versioned GitHub Pages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: '배포하거나 복구할 정식 버전 태그 (예: v1.0.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    env:
      ANALYTICS_ENV: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag and main ancestry
        env:
          RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
        run: pnpm check:release
      - run: pnpm verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
